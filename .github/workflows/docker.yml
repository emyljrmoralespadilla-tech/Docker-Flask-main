name: Publicar Imagen en Docker Hub

on:
  push:
    branches: ["master", "feature/vulnerabilidades"]

jobs:
  test-and-security:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v3

      - name: Configurar python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install Flask mysql-connector-python pytest bandit
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Escaneo de seguridad (bandit)
        run: bandit -r . -s B101,B104,B106,B201

      - name: Ejecutar pruebas pytest
        run: pytest

  build-and-push:
    needs: test-and-security
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v3

      - name: Iniciar sesión en docker hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir imagen
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          load: true
          no-cache: true
          tags: emylmorales/docker-flask-backend:latest

      - name: Escanear contenedor con trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'emylmorales/docker-flask-backend:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          trivyignores: '.trivyignore'

      - name: Subir la imagen a Docker Hub
        run: docker push emylmorales/docker-flask-backend:latest

      - name: Desplegar en servidor cloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            docker pull emylmorales/docker-flask-backend:latest
            docker stop flask-app || true
            docker rm flask-app || true
            docker run -d -p 5050:5050 --name flask-app emylmorales/docker-flask-backend:latest