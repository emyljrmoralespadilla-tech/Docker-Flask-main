name: Publicar Imagen en Docker Hub y Desplegar

on:
  push:
    branches: ["master", "main", "feature/vulnerabilidades", "feature/bad-security"]
  pull_request:
    branches: ["master", "main"]

jobs:
  test-and-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pytest

      - name: Ejecutar Pruebas Unitarias (Pytest)
        run: pytest

      - name: Análisis Estático de Seguridad (Bandit)
        run: bandit sample_app.py

  build-scan-and-push:
    needs: test-and-security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 1. Construye la imagen en el entorno virtual (sin publicarla aún)
      - name: Construir imagen localmente
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/docker-flask:latest

      # 2. Escaneo Fail-Fast con Trivy (Bloquea si encuentra vulnerabilidades CRITICAL u HIGH)
      - name: Escaneo de Vulnerabilidades de Imagen (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/docker-flask:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      # 3. Sube la imagen SOLO si Trivy no encontró vulnerabilidades
      - name: Subir imagen a Docker Hub
        uses: docker/build-push-action@v5
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/docker-flask:latest

  deploy:
    needs: build-scan-and-push
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Despliegue Automático vía SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/Docker-Flask-main
            git pull origin master
            docker compose pull
            docker compose up -d --build  