name: Publicar Imagen en Docker Hub y Desplegar

on:
  push:
    branches: ["master", "main", "feature/bad-security"]
  pull_request:
    branches: ["master", "main"]

jobs:
  test-and-security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v3

      - name: Configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install bandit pytest

      - name: Ejecutar Pruebas Unitarias (Pytest)
        run: pytest -v test_app.py

      - name: Análisis Estático de Seguridad (Bandit)
        run: bandit -r . -x ./venv -l

  build-scan-and-push:
    needs: test-and-security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Construir imagen localmente
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/docker-flask:latest

      - name: Escaneo de Vulnerabilidades de Imagen (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ secrets.DOCKERHUB_USERNAME }}/docker-flask:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Subir imagen a Docker Hub
        uses: docker/build-push-action@v5
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/docker-flask:latest
